name: OTTSubtitleOverlay
options:
  bundleIdPrefix: com.irshad
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO

targets:
  OTTSubtitleOverlay:
    type: application
    platform: iOS
    sources:
      - path: OTTSubtitleOverlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irshad.ottsubtitleoverlay
        INFOPLIST_FILE: OTTSubtitleOverlay/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: BroadcastExtension
        embed: true

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irshad.ottsubtitleoverlay.BroadcastExtension
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
